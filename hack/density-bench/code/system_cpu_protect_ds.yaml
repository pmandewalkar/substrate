# Density campaign: protect the node agents under CPU overload (node-level, A/B-able).
# On COS/GKE, kubelet and containerd run in system.slice with cpu.weight=100, while kubepods.slice gets ~7,478 (scaled to
# allocatable CPUs), so when actors saturate the CPU, kubelet+containerd share ~1.3% (~2.5 of 192 cores) and the node goes
# NotReady. Raise system.slice's weight (only matters under contention; idle share is redistributed).
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: substrate-system-cpu-protect
  namespace: kube-system
  labels: {app: substrate-system-cpu-protect}
spec:
  selector: {matchLabels: {app: substrate-system-cpu-protect}}
  template:
    metadata: {labels: {app: substrate-system-cpu-protect}}
    spec:
      hostPID: true
      nodeSelector: {bench-node: c3-metal}
      tolerations: [{operator: Exists}]
      priorityClassName: system-node-critical
      containers:
      - name: p
        image: gcr.io/pmandewalkar-gke-dev/ate-images/busybox:1.36
        securityContext: {privileged: true}
        resources: {requests: {cpu: 5m, memory: 8Mi}}
        command: ["nsenter", "-t", "1", "-m", "--", "sh", "-c",
                  "while true; do echo 1500 > /sys/fs/cgroup/system.slice/cpu.weight; sleep 60; done"]
