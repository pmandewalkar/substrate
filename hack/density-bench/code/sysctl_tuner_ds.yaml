apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: substrate-sysctl-tuner
  namespace: kube-system
spec:
  selector:
    matchLabels:
      app: substrate-sysctl-tuner
  template:
    metadata:
      labels:
        app: substrate-sysctl-tuner
    spec:
      hostNetwork: true
      nodeSelector:
        cloud.google.com/gke-nodepool: c3-metal-192
      tolerations:
      - operator: Exists
      containers:
      - name: sysctl-tuner
        image: gcr.io/pmandewalkar-gke-dev/ate-images/busybox:1.36
        securityContext:
          privileged: true
        command:
        - sh
        - -ce
        - |
          sysctl -w net.ipv4.neigh.default.gc_thresh1=4096
          sysctl -w net.ipv4.neigh.default.gc_thresh2=16384
          sysctl -w net.ipv4.neigh.default.gc_thresh3=32768
          sysctl -w fs.inotify.max_user_instances=65536
          sysctl -w fs.inotify.max_user_watches=1048576
          sleep infinity
